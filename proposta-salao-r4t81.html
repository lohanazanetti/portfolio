<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#1F0822">
    <meta name="robots" content="noindex, nofollow">
    <title>Proposta de conteúdo para o Lumina Studio | Creator Mobile</title>
    <meta name="description" content="Proposta de conteúdo para Instagram: Reels, carrosséis e posts, com captações no salão.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=Josefin+Sans:wght@200;300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos exclusivos desta proposta. O style.css compartilhado não é alterado. */

        /* ═══════ INCLUSO NO PACOTE ═══════ */
        .include-list { list-style: none; margin-top: 6px; }
        .include-list li {
            position: relative;
            padding: 12px 0 12px 26px;
            border-top: 1px solid var(--accent10);
            font-size: 0.88rem;
            font-weight: 300;
            color: var(--t2);
            line-height: 1.7;
        }
        .include-list li:first-child { border-top: none; }
        .include-list li::before {
            content: "";
            position: absolute;
            left: 4px;
            top: 21px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
        }
        .include-list strong { color: var(--white); font-weight: 500; }

        /* ═══════ INVESTIMENTO ═══════ */
        .price-card {
            background: var(--bg-2);
            border: 1px solid var(--accent25);
            border-radius: 20px;
            padding: 28px 24px;
            text-align: center;
            margin: 8px 0 22px;
        }
        .price-label {
            font-family: var(--caps);
            font-size: 0.68rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 8px;
        }
        .price-value {
            font-family: var(--display);
            font-size: clamp(2.6rem, 10vw, 3.6rem);
            font-weight: 400;
            color: var(--white);
            line-height: 1.1;
        }
        .price-value small {
            font-family: var(--body);
            font-size: 1rem;
            font-weight: 300;
            color: var(--t3);
        }
        .price-note { font-size: 0.8rem; color: var(--t3); margin-top: 6px; }
        .pill-save {
            display: inline-block;
            font-family: var(--caps);
            font-size: 0.66rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent);
            background: var(--accent10);
            border: 1px solid var(--accent25);
            padding: 6px 14px;
            border-radius: 100px;
            margin-top: 16px;
        }
        .comp-caption {
            font-family: var(--caps);
            font-size: 0.68rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--t3);
            margin: 22px 0 10px;
        }
        .comp-table td:not(:first-child),
        .comp-table th:not(:first-child) { text-align: right; }
        .comp-table tfoot td {
            border-top: 1px solid var(--accent25);
            color: var(--white);
            font-weight: 500;
        }

        /* ═══════ CRONOGRAMA EM CARDS ═══════ */
        .week { margin-top: 30px; }
        .week-label {
            font-family: var(--caps);
            font-size: 0.72rem;
            font-weight: 300;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 12px;
        }
        .week-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
        .idea-card {
            background: var(--bg-2);
            border: 1px solid transparent;
            border-radius: 16px;
            padding: 20px 18px;
        }
        .idea-tag {
            display: inline-block;
            font-family: var(--caps);
            font-size: 0.62rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--bg);
            background: var(--accent);
            padding: 3px 12px;
            border-radius: 100px;
            margin-bottom: 12px;
        }
        .idea-tag.feed { color: var(--accent); background: var(--accent15); }
        .idea-title {
            font-family: var(--display);
            font-size: 1.35rem;
            font-weight: 400;
            color: var(--white);
            line-height: 1.25;
            margin-bottom: 10px;
        }
        .idea-list { list-style: none; margin-bottom: 12px; }
        .idea-list li {
            position: relative;
            padding-left: 16px;
            font-size: 0.82rem;
            font-weight: 300;
            color: var(--t2);
            line-height: 1.7;
            margin-bottom: 4px;
        }
        .idea-list li::before {
            content: "";
            position: absolute;
            left: 2px;
            top: 0.72em;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent);
            opacity: 0.6;
        }
        .idea-why {
            font-size: 0.76rem;
            color: var(--t3);
            font-style: italic;
            line-height: 1.65;
            border-top: 1px solid var(--accent10);
            padding-top: 10px;
        }
        @media (min-width: 640px) {
            .week-grid { grid-template-columns: 1fr 1fr; }
        }

        /* ═══════ ROTINA ═══════ */
        .steps { list-style: none; counter-reset: step; margin-top: 6px; }
        .steps li {
